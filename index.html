<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ComboChart demo</title>
  <style>
    body { margin: 0; padding: 24px 16px 48px; background: #f4f5f7; color: #222;
      font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; }
    main { max-width: 820px; margin: 0 auto; }
    h1 { font-size: 22px; margin: 0 0 4px; }
    h2 { font-size: 16px; margin: 32px 0 8px; }
    p { margin: 0 0 12px; color: #555; }
    .card { background: #fff; border-radius: 8px; padding: 20px; box-shadow: 0 1px 2px rgba(0,0,0,.08); }
    /* Same surroundings as on the reference recording: pink table cell */
    .cell { background: #fce0e3; padding: 16px; display: inline-block; max-width: 100%; box-sizing: border-box; }
    #chart-reference { width: 350px; max-width: 100%; }
    #chart-large { height: 260px; }
    button { font: inherit; padding: 6px 14px; border-radius: 6px; border: 1px solid #ccc; background: #fff; cursor: pointer; }
    button:hover { background: #f0f0f0; }
    pre { background: #1e1f22; color: #e6e6e6; padding: 16px; border-radius: 8px; overflow-x: auto; font-size: 13px; }
  </style>
</head>
<body>
<main>
  <h1>ComboChart</h1>
  <p>Четыре временных ряда на одном графике: area, bar, spline, line. Наведите курсор на график, коснитесь его на телефоне или перейдите на него клавишей Tab и листайте даты стрелками ← →.</p>

  <h2>1. Как на записи</h2>
  <div class="cell"><div id="chart-reference"></div></div>

  <h2>2. 30 дней случайных данных, резиновая ширина</h2>
  <div class="card">
    <div id="chart-large"></div>
    <p style="margin:12px 0 0"><button id="regen">Сгенерировать новые данные</button></p>
  </div>

  <h2>Код первого графика</h2>
  <pre id="code"></pre>
</main>

<script src="combo-chart.js"></script>
<script id="reference-code">
const chart = new ComboChart('#chart-reference', {
  area: {
    name: 'Cost',
    data: [['2026-06-10', 2.04], ['2026-06-11', 25.85], ['2026-06-12', 44.36], ['2026-06-13', 55.65], ['2026-06-14', 63.75]]
  },
  bar: {
    name: 'CPA',
    data: [['2026-06-10', 0.68], ['2026-06-11', 0.86], ['2026-06-12', 1.23], ['2026-06-13', 0.79], ['2026-06-14', 0.71]]
  },
  spline: {
    name: 'ROI confirmed',
    data: [['2026-06-10', 610.78], ['2026-06-11', 180.5], ['2026-06-12', 161.47], ['2026-06-13', 56.33], ['2026-06-14', 357.25]]
  },
  line: {
    name: 'Conversions',
    data: [['2026-06-10', 3], ['2026-06-11', 30], ['2026-06-12', 36], ['2026-06-13', 70], ['2026-06-14', 90]]
  }
});
</script>
<script>
  document.getElementById('code').textContent = document.getElementById('reference-code').textContent.trim();

  function randomSeries(days) {
    const start = new Date(2026, 5, 1);
    const cost = [], cpa = [], roi = [], conv = [];
    const jitter = (amp) => (Math.random() - 0.5) * 2 * amp;
    const phase = Math.random() * Math.PI * 2;
    for (let i = 0; i < days; i++) {
      const d = new Date(start.getFullYear(), start.getMonth(), start.getDate() + i);
      // Cumulative-looking cost and conversions, CPA derived from them, ROI oscillating around 100%+
      const c = Math.max(1, 2 + i * 2.1 + jitter(3));
      const n = Math.max(1, Math.round(3 + i * 2.8 + jitter(6)));
      const r = Math.max(20, 220 + 170 * Math.sin(i / 3.5 + phase) + jitter(40));
      cost.push([d, +c.toFixed(2)]);
      cpa.push([d, +(c / n).toFixed(2)]);
      roi.push([d, +r.toFixed(2)]);
      conv.push([d, n]);
    }
    return { cost, cpa, roi, conv };
  }

  function largeConfig() {
    const s = randomSeries(30);
    return {
      series: [
        { type: 'area',   name: 'Cost',          data: s.cost, valuePrefix: '$' },
        { type: 'bar',    name: 'CPA',           data: s.cpa,  valuePrefix: '$' },
        { type: 'spline', name: 'ROI confirmed', data: s.roi,  valueSuffix: '%' },
        { type: 'line',   name: 'Conversions',   data: s.conv }
      ]
    };
  }

  const large = new ComboChart('#chart-large', largeConfig());
  document.getElementById('regen').addEventListener('click', () => large.update(largeConfig()));
</script>
</body>
</html>
